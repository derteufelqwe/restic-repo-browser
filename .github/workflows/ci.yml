name: ci

on:
  push:
    branches: [main, master]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      # The integration tests use a real restic binary and skip themselves without one.
      - name: Install restic
        run: |
          curl -fsSL -o restic.bz2 https://github.com/restic/restic/releases/download/v0.19.1/restic_0.19.1_linux_amd64.bz2
          bunzip2 restic.bz2
          sudo install -m 0755 restic /usr/local/bin/restic
          rm -f restic
          restic version

      - name: Check formatting
        run: test -z "$(gofmt -l .)"
      - run: go vet ./...
      - run: go test ./...

      - name: Build for every release target
        run: |
          for target in linux/amd64 linux/arm64 windows/amd64 darwin/arm64; do
            GOOS=${target%/*} GOARCH=${target#*/} CGO_ENABLED=0 go build -o /dev/null ./cmd/restic-browser
          done
